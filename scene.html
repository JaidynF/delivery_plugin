<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UPSCALD — One Call (render source)</title>
<style>
  :root{
    /* Brand grayscale — UpScald Marketing identity board */
    --black:#0B0B0D;
    --gray-dark:#1D1D1F;
    --gray:#686B70;
    --gray-light:#F5F5F7;
    --white:#FFFFFF;
    /* Brand accent gradient: orange -> purple -> cyan */
    --orange:#FF8A00;
    --orange-red:#FF4500;
    --purple:#7B3FF2;
    --cyan:#00C2FF;
    --blue:#2244FF;
    /* Brand typography: SF Pro Display for headlines, SF Pro Text for body/support copy */
    --font-display:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    --font-text:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:1080px;height:1920px; /* 9:16 render canvas */
    background:var(--black);
    overflow:hidden;
    font-family:var(--font-display);
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative; width:1080px; height:1920px; background:var(--black);
    display:flex; align-items:center; justify-content:center;
  }

  /* ============ LOGO ============ */
  #logo{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; opacity:0;
  }
  #logo svg{ width:150px; height:150px; margin-bottom:36px; }
  #logo .word{ font-size:56px; font-weight:700; color:var(--white); letter-spacing:-1px; }
  #logo .word .sub{ font-weight:300; color:var(--gray); }
  #logo .tag{ font-size:26px; color:var(--gray); font-weight:500; margin-top:16px; font-family:var(--font-text); }

  /* ============ CAPTION ============ */
  #caption{
    position:absolute; left:0; right:0; text-align:center; opacity:0;
    padding:0 90px; top:50%; transform:translateY(-50%);
  }
  #caption .l1{ font-size:58px; font-weight:700; color:var(--white); letter-spacing:-1px; line-height:1.2; }
  #caption .l2{ font-size:30px; color:var(--gray); font-weight:500; margin-top:18px; font-family:var(--font-text); }

  /* ============ PHONE ============ */
  #phone-wrap{
    position:relative; width:620px; height:1264px; opacity:0;
    transform:translateY(60px) scale(0.94);
  }
  #glow{
    position:absolute; inset:-120px; border-radius:50%;
    background:radial-gradient(circle, rgba(123,63,242,0.35) 0%, rgba(123,63,242,0.12) 40%, transparent 70%);
    opacity:0; filter:blur(10px);
  }
  #phone{
    position:relative; width:620px; height:1264px; border-radius:108px;
    background:linear-gradient(155deg,#3a3a3d,#1a1a1c 40%,#0a0a0b);
    padding:22px;
    box-shadow:0 0 0 2px rgba(255,255,255,0.06);
  }
  #screen{
    width:100%; height:100%; border-radius:88px; background:#000;
    overflow:hidden; position:relative;
  }
  #island{
    position:absolute; top:26px; left:50%; transform:translateX(-50%);
    width:170px; height:44px; background:#000; border-radius:26px; z-index:80;
  }
  #statusbar{
    position:absolute; top:0; left:0; right:0; height:96px; z-index:70;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:20px 48px 16px;
  }
  #statusbar .time{ font-size:30px; font-weight:600; color:#fff; }
  #statusbar .icons{ display:flex; align-items:center; gap:8px; }
  .sig-bars{ display:flex; align-items:flex-end; gap:3px; height:16px; }
  .sig-bars div{ width:5px; background:#fff; border-radius:1px; }
  .sig-bars div:nth-child(1){height:6px;} .sig-bars div:nth-child(2){height:9px;}
  .sig-bars div:nth-child(3){height:12px;} .sig-bars div:nth-child(4){height:16px;}
  .wifi-icon{ width:20px; height:16px; }
  .batt{ width:38px; height:19px; border:2px solid #fff; border-radius:5px; position:relative; opacity:0.95; }
  .batt::after{ content:''; position:absolute; right:-5px; top:5px; width:3px; height:9px; background:#fff; border-radius:0 2px 2px 0; }
  .batt::before{ content:''; position:absolute; top:2px; left:2px; bottom:2px; width:80%; background:#fff; border-radius:2px; }

  .layer{ position:absolute; inset:0; opacity:0; }

  /* Lock screen */
  #wallpaper{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 30% 18%, rgba(255,138,0,0.14), transparent 42%),
      radial-gradient(circle at 75% 70%, rgba(123,63,242,0.20), transparent 50%),
      linear-gradient(160deg,#15101f,#08080d 60%,#000);
  }
  #locktime{
    position:absolute; top:230px; left:0; right:0; text-align:center; z-index:20; color:#fff;
  }
  #locktime .t{ font-size:158px; font-weight:200; letter-spacing:-4px; line-height:1; }
  #locktime .d{ font-size:34px; font-weight:600; margin-top:14px; opacity:0.92; font-family:var(--font-text); }

  /* Notification */
  .notif{
    position:absolute; left:30px; right:30px; top:350px;
    background:rgba(255,255,255,0.13); backdrop-filter:blur(40px); -webkit-backdrop-filter:blur(40px);
    border-radius:44px; padding:26px 30px;
    display:flex; gap:22px; align-items:flex-start;
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:0 20px 50px -10px rgba(0,0,0,0.6);
    opacity:0; transform:translateY(-50px) scale(0.9);
  }
  .notif-icon{
    width:72px; height:72px; border-radius:20px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:34px;
    background:linear-gradient(135deg,var(--orange),var(--purple),var(--cyan));
  }
  .notif-body{ flex:1; min-width:0; }
  .notif-app{ font-size:22px; font-weight:700; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:1px; font-family:var(--font-text); }
  .notif-title{ font-size:32px; font-weight:700; color:#fff; margin-top:4px; }
  .notif-msg{ font-size:27px; color:rgba(255,255,255,0.85); margin-top:6px; line-height:1.35; font-family:var(--font-text); }

  /* Thread */
  #thread{
    position:absolute; inset:0; padding:120px 34px 90px; display:flex; flex-direction:column; gap:20px;
    justify-content:flex-end;
  }
  .bubble{
    max-width:80%; padding:22px 30px; border-radius:38px; font-size:29px; line-height:1.4;
    opacity:0; transform:translateY(20px) scale(0.95); font-family:var(--font-text);
  }
  .bubble.out{ align-self:flex-end; background:linear-gradient(135deg,var(--orange),var(--purple)); color:#fff; border-bottom-right-radius:12px; }
  .bubble.in{ align-self:flex-start; background:rgba(255,255,255,0.12); color:#fff; border-bottom-left-radius:12px; }
  .typing{
    align-self:flex-start; background:rgba(255,255,255,0.12); border-radius:38px; border-bottom-left-radius:12px;
    padding:20px 28px; display:flex; gap:8px; opacity:0;
  }
  .typing span{ width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,0.6); }

  /* Booking card */
  #bookcard{
    position:absolute; left:44px; right:44px; bottom:0;
    background:var(--gray-dark); border-radius:56px 56px 0 0; padding:56px 48px 90px;
    border:1px solid rgba(255,255,255,0.08); border-bottom:none;
    box-shadow:0 -30px 60px -20px rgba(0,0,0,0.7);
    opacity:0; transform:translateY(100%);
  }
  .bc-label{ font-size:24px; font-weight:700; background:linear-gradient(90deg,var(--orange),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent; text-transform:uppercase; letter-spacing:2px; }
  .bc-title{ font-size:44px; font-weight:700; color:#fff; margin-top:14px; }
  .bc-sub{ font-size:28px; color:rgba(255,255,255,0.6); margin-top:10px; font-family:var(--font-text); }
  .bc-check{
    margin-top:38px; width:96px; height:96px; border-radius:50%;
    background:linear-gradient(135deg,var(--cyan),var(--purple));
    display:flex; align-items:center; justify-content:center; font-size:46px; color:#fff;
    opacity:0; transform:scale(0.4);
  }

  /* Review */
  #reviewcard{ position:absolute; left:44px; right:44px; top:640px; text-align:center; opacity:0; transform:scale(0.9); }
  .stars{ font-size:70px; letter-spacing:14px; }
  .star{ opacity:0; display:inline-block; transform:scale(0) rotate(-40deg); color:var(--orange); }
  .review-name{ color:#fff; font-size:36px; font-weight:700; margin-top:26px; }
  .review-sub{ color:rgba(255,255,255,0.5); font-size:26px; margin-top:8px; font-style:italic; font-family:var(--font-text); }

  #veil{ position:absolute; inset:0; background:var(--black); opacity:0; z-index:500; }
</style>
</head>
<body>
<div id="stage">

  <div id="logo">
    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lg1" x1="0%" y1="100%" x2="60%" y2="0%">
          <stop offset="0%" stop-color="#FF4500"/><stop offset="100%" stop-color="#FF8A00"/>
        </linearGradient>
        <linearGradient id="lg2" x1="100%" y1="100%" x2="40%" y2="0%">
          <stop offset="0%" stop-color="#2244FF"/><stop offset="50%" stop-color="#7B3FF2"/><stop offset="100%" stop-color="#00C2FF"/>
        </linearGradient>
      </defs>
      <polygon points="4,44 24,4 28,44" fill="url(#lg1)"/>
      <polygon points="24,4 44,44 16,44" fill="url(#lg2)" opacity="0.96"/>
    </svg>
    <div class="word">UPSCALD <span class="sub">MARKETING</span></div>
    <div class="tag" id="logo-tag">Smarter systems. More customers.</div>
  </div>

  <div id="caption"><div class="l1" id="cap-l1"></div><div class="l2" id="cap-l2"></div></div>

  <div id="phone-wrap">
    <div id="glow"></div>
    <div id="phone">
      <div id="screen">
        <div id="island"></div>
        <div id="statusbar">
          <div class="time">9:41</div>
          <div class="icons">
            <div class="sig-bars"><div></div><div></div><div></div><div></div></div>
            <svg class="wifi-icon" viewBox="0 0 20 16" fill="none"><path d="M10 13.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" fill="#fff"/><path d="M6.5 9.5a5 5 0 017 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M3.5 6.5a9 9 0 0113 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/></svg>
            <div class="batt"></div>
          </div>
        </div>

        <div id="wallpaper" class="layer"></div>
        <div id="locktime" class="layer"><div class="t">9:41</div><div class="d">Tuesday, August 22</div></div>
        <div id="notif-layer"></div>
        <div id="thread-layer" class="layer"></div>
        <div id="book-layer" class="layer"></div>
        <div id="review-layer" class="layer"></div>
      </div>
    </div>
  </div>

  <div id="veil"></div>
</div>

<script>
/* ============================================================
   DETERMINISTIC TIMELINE
   window.__setTime(ms) puts the scene into an exact visual state
   for time `ms` since the start of the video. The render script
   calls this once per output frame and screenshots the result —
   so playback speed of the machine doing the rendering never
   matters. This file also self-plays in realtime if opened in a
   normal browser (for previewing), driven by requestAnimationFrame.
   ============================================================ */

const DURATION_MS = 20000;

const el = {
  logo: document.getElementById('logo'),
  logoTag: document.getElementById('logo-tag'),
  caption: document.getElementById('caption'),
  capL1: document.getElementById('cap-l1'),
  capL2: document.getElementById('cap-l2'),
  phoneWrap: document.getElementById('phone-wrap'),
  glow: document.getElementById('glow'),
  wallpaper: document.getElementById('wallpaper'),
  locktime: document.getElementById('locktime'),
  notifLayer: document.getElementById('notif-layer'),
  threadLayer: document.getElementById('thread-layer'),
  bookLayer: document.getElementById('book-layer'),
  reviewLayer: document.getElementById('review-layer'),
  veil: document.getElementById('veil'),
};

// ---- easing helpers ----
const clamp01 = (x)=>Math.max(0,Math.min(1,x));
const lerp = (a,b,t)=>a+(b-a)*t;
// progress of value v within [start,end], clamped 0..1
const prog = (v,start,end)=> end===start ? (v>=end?1:0) : clamp01((v-start)/(end-start));
const easeOutBack = (t)=>{ const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };
const easeOutCubic = (t)=>1-Math.pow(1-t,3);
const easeInOutCubic = (t)=> t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

// ---- content builders (built once, driven by opacity/transform per frame) ----
function buildNotif(id, app, title, msg){
  const n = document.createElement('div');
  n.className='notif'; n.id=id;
  n.innerHTML = `<div class="notif-icon">●</div><div class="notif-body"><div class="notif-app">${app}</div><div class="notif-title">${title}</div><div class="notif-msg">${msg}</div></div>`;
  return n;
}

// Shot 5 notif
const notif5 = buildNotif('notif5','UPSCALD','New Lead','Jordan submitted the contact form.');
el.notifLayer.appendChild(notif5);

// Shot 8 notifs (3, sequential)
const notif8a = buildNotif('notif8a','UPSCALD','Reminder Sent','24-hour reminder sent to Jordan.');
const notif8b = buildNotif('notif8b','UPSCALD','On Our Way','1-hour reminder — technician en route.');
const notif8c = buildNotif('notif8c','UPSCALD','Job Complete','Panel repair finished — invoice sent.');
[notif8a,notif8b,notif8c].forEach(n=>el.notifLayer.appendChild(n));

// Shot 6 thread bubbles
el.threadLayer.innerHTML = `
  <div id="typing" class="typing"><span></span><span></span><span></span></div>
  <div id="b1" class="bubble out">Hi Jordan — thanks for reaching out! What's going on?</div>
  <div id="b2" class="bubble in">Kitchen outlet stopped working</div>
  <div id="b3" class="bubble out">We can have someone out Thursday at 2pm — book it?</div>
  <div id="b4" class="bubble in">Yes please!</div>
`;
const bubbles = ['typing','b1','b2','b3','b4'].map(id=>document.getElementById(id));

// Shot 7 booking card
el.bookLayer.innerHTML = `
  <div id="bookcard">
    <div class="bc-label">Appointment Confirmed</div>
    <div class="bc-title">Thursday · 2:00 PM</div>
    <div class="bc-sub">Electrical repair — Jordan M.</div>
    <div class="bc-check" id="bccheck">✓</div>
  </div>`;
const bookcard = document.getElementById('bookcard');
const bccheck = document.getElementById('bccheck');

// Shot 9 review card
el.reviewLayer.innerHTML = `
  <div id="reviewcard">
    <div class="stars">
      <span class="star" id="s1">★</span><span class="star" id="s2">★</span><span class="star" id="s3">★</span><span class="star" id="s4">★</span><span class="star" id="s5">★</span>
    </div>
    <div class="review-name">Jordan left a 5-star review</div>
    <div class="review-sub">"Fastest response I've ever gotten from a contractor."</div>
  </div>`;
const reviewcard = document.getElementById('reviewcard');
const stars = ['s1','s2','s3','s4','s5'].map(id=>document.getElementById(id));

function setNotifState(node, arriveStart, arriveEnd, holdEnd, leaveEnd, t){
  if(t<arriveStart || t>leaveEnd){ node.style.opacity=0; return; }
  if(t<=arriveEnd){
    const p = easeOutBack(prog(t,arriveStart,arriveEnd));
    node.style.opacity = clamp01(prog(t,arriveStart,arriveStart+80));
    node.style.transform = `translateY(${lerp(-50,0,p)}px) scale(${lerp(0.9,1,p)})`;
  } else if(t<=holdEnd){
    node.style.opacity=1; node.style.transform='translateY(0px) scale(1)';
  } else {
    const p = easeOutCubic(prog(t,holdEnd,leaveEnd));
    node.style.opacity = 1-p;
    node.style.transform = `translateY(${lerp(0,-25,p)}px) scale(${lerp(1,0.95,p)})`;
  }
}

function setBubbleState(node, arriveStart, arriveEnd, t){
  if(t<arriveStart){ node.style.opacity=0; return; }
  const p = easeOutBack(prog(t,arriveStart,arriveEnd));
  node.style.opacity = clamp01(prog(t,arriveStart,arriveStart+60));
  node.style.transform = `translateY(${lerp(20,0,p)}px) scale(${lerp(0.95,1,p)})`;
}

function setCaption(l1, l2, fadeInStart, fadeInEnd, fadeOutStart, fadeOutEnd, t){
  if(t<fadeInStart-1 || t>fadeOutEnd+1){ el.caption.style.opacity=0; return; }
  el.capL1.textContent=l1; el.capL2.textContent=l2||'';
  let o;
  if(t<fadeInEnd) o = prog(t,fadeInStart,fadeInEnd);
  else if(t<fadeOutStart) o = 1;
  else o = 1-prog(t,fadeOutStart,fadeOutEnd);
  el.caption.style.opacity = clamp01(o);
}

/* =========== MASTER TIMELINE FUNCTION =========== */
function setTime(t){
  t = Math.max(0, Math.min(DURATION_MS, t));

  // ---------- Shot 1 [0-1000]: logo mark only ----------
  const s1o = prog(t,0,700);
  // ---------- Shot 2 [1000-2000]: wordmark+tag, hold, hard cut to black at 2000 ----------
  const s2FadeIn = prog(t,1000,1500);
  const s2Visible = t>=1000 && t<2000;
  el.logo.style.opacity = t<2000 ? Math.max(s1o*(t<1000?1:1), (t>=1000? Math.max(s1o,1):s1o)) : 0;
  if(t<1000){ el.logo.style.opacity=s1o; el.logoTag.style.opacity=0; document.querySelector('#logo .word').style.opacity=0; }
  else if(t<2000){ el.logo.style.opacity=1; document.querySelector('#logo .word').style.opacity=s2FadeIn; el.logoTag.style.opacity=s2FadeIn; el.logoTag.textContent='Smarter systems. More customers.'; }
  else { el.logo.style.opacity=0; }

  // ---------- Shot 3 [2000-3000]: "A missed call is a lost customer." ----------
  setCaption('A missed call is a lost customer.', '', 2000,2350, 2650,3000, t);

  // ---------- Shot 4 [3000-5000]: phone rises + lock screen ----------
  const phoneStart=3000;
  if(t<phoneStart){ el.phoneWrap.style.opacity=0; }
  else {
    const settleP = easeOutBack(prog(t,3000,3800));
    el.phoneWrap.style.opacity = clamp01(prog(t,3000,3300));
    el.phoneWrap.style.transform = `translateY(${lerp(60,0,settleP)}px) scale(${lerp(0.94,1,settleP)})`;
    el.glow.style.opacity = clamp01(prog(t,3000,3800));
    el.wallpaper.style.opacity = clamp01(prog(t,3000,3300));
    el.locktime.style.opacity = clamp01(prog(t,3000,3300));
  }

  // ---------- continuous dolly-in [3000 -> 13000], holds at 13000-15000, reverses 15000-16000 ----------
  let scale = 1;
  const dollyStart=3000, dollyTightEnd=13000, holdEnd=15000, pullbackEnd=16000;
  if(t<dollyStart) scale=1;
  else if(t<dollyTightEnd) scale = lerp(1, 1.42, easeInOutCubic(prog(t,dollyStart,dollyTightEnd)));
  else if(t<holdEnd) scale=1.42;
  else if(t<pullbackEnd) scale = lerp(1.42, 0.7, easeInOutCubic(prog(t,holdEnd,pullbackEnd)));
  else scale=0.7;
  if(t>=dollyStart){
    const settleP = t<3800 ? easeOutBack(prog(t,3000,3800)) : 1;
    const baseY = lerp(60,0,settleP);
    el.phoneWrap.style.transform = `translateY(${baseY}px) scale(${scale})`;
  }
  if(t>pullbackEnd-200 && t<pullbackEnd+400){
    el.phoneWrap.style.opacity = clamp01(1-prog(t,pullbackEnd-200,pullbackEnd+200));
  } else if (t<=pullbackEnd-200 && t>=phoneStart){
    el.phoneWrap.style.opacity=1;
  } else if(t>pullbackEnd+400){
    el.phoneWrap.style.opacity=0;
  }

  // hide lockscreen once thread/notifs begin
  el.locktime.style.opacity = (t>=3300 && t<5000) ? 1 : 0;
  el.wallpaper.style.opacity = (t>=3300 && t<11000) ? (t<5000?1:0.25) : (t<3300?0:0);

  // ---------- Shot 5 [5000-6000]: New Lead notif ----------
  setNotifState(notif5, 5000,5300,5500,6000, t);

  // ---------- Shot 6 [6000-9000]: thread ----------
  setBubbleState(bubbles[0], 6000,6250, t); // typing
  document.getElementById('typing').style.opacity = (t>=6000 && t<6650) ? clamp01(prog(t,6000,6150)) * (t<6500?1:1-prog(t,6500,6650)) : 0;
  setBubbleState(bubbles[1], 6650,6950, t); // b1 out
  setBubbleState(bubbles[2], 7350,7600, t); // b2 in
  setBubbleState(bubbles[3], 8000,8300, t); // b3 out
  setBubbleState(bubbles[4], 8650,8900, t); // b4 in
  el.threadLayer.style.opacity = (t>=6000 && t<9200) ? 1 : (t<6000?0:0);

  // ---------- Shot 7 [9000-11000]: booking card ----------
  if(t<9000){ bookcard.style.opacity=0; bookcard.style.transform='translateY(100%)'; bccheck.style.opacity=0; }
  else if(t<9450){
    const p = easeOutCubic(prog(t,9000,9450));
    bookcard.style.opacity=1;
    bookcard.style.transform = `translateY(${lerp(100,0,p)}%)`;
  } else if (t<11000){
    bookcard.style.opacity=1; bookcard.style.transform='translateY(0%)';
    const cp = easeOutBack(prog(t,9500,9850));
    bccheck.style.opacity = clamp01(prog(t,9500,9650));
    bccheck.style.transform = `scale(${lerp(0.4,1,cp)})`;
  } else {
    bookcard.style.opacity = clamp01(1-prog(t,11000,11150));
  }
  el.bookLayer.style.opacity = (t>=9000 && t<11200) ? 1 : 0;

  // ---------- Shot 8 [11000-13000]: 3 quick notifs ----------
  setNotifState(notif8a, 11000,11220,11550,11800, t);
  setNotifState(notif8b, 11800,12020,12350,12600, t);
  setNotifState(notif8c, 12600,12820,13150,13400, t);

  // ---------- Shot 9 [13000-15000]: review card, hold ----------
  if(t<13000){ reviewcard.style.opacity=0; reviewcard.style.transform='scale(0.9)'; }
  else {
    reviewcard.style.opacity = clamp01(prog(t,13000,13200));
    reviewcard.style.transform = `scale(${lerp(0.9,1,easeOutCubic(prog(t,13000,13300)))})`;
  }
  const starDelays = [13100,13180,13260,13340,13420];
  stars.forEach((s,i)=>{
    const st = starDelays[i];
    if(t<st){ s.style.opacity=0; s.style.transform='scale(0) rotate(-40deg)'; }
    else {
      const p = easeOutBack(prog(t,st,st+300));
      s.style.opacity=clamp01(prog(t,st,st+120));
      s.style.transform = `scale(${lerp(0,1,p)}) rotate(${lerp(-40,0,p)}deg)`;
    }
  });
  el.reviewLayer.style.opacity = (t>=13000 && t<16000) ? 1 : 0;

  // ---------- Shot 10 [15000-16000]: pullback handled above via scale; extra fade to black ----------
  if(t>=16000 && t<16400){
    el.veil.style.opacity = clamp01(prog(t,15900,16300));
  } else if(t>=16400){
    el.veil.style.opacity=1;
  } else {
    el.veil.style.opacity=0;
  }

  // ---------- Shot 11 [16400-18400]: "Nothing goes cold." ----------
  setCaption('Nothing goes cold.', '', 16600,17000, 18000,18350, t);

  // ---------- Shot 12 [18400-20000]: closing logo lockup ----------
  if(t<18350){
    // keep hidden until previous cuts away
  } else {
    const p = prog(t,18400,18900);
    el.logo.style.opacity = p>0?1:0;
    document.querySelector('#logo .word').style.opacity = clamp01(prog(t,18400,18800));
    el.logoTag.style.opacity = clamp01(prog(t,18400,18800));
    el.logoTag.textContent='Your leads, always answered.';
  }
  if(t>=18350 && t<18450){ el.veil.style.opacity = 1-prog(t,18350,18450); }
  if(t>=20000-1){ el.veil.style.opacity=0; }
}
window.__setTime = setTime;
window.__DURATION_MS = DURATION_MS;

// ---- realtime self-preview (only runs if not being driven by the renderer) ----
if(!window.__RENDER_MODE){
  let startTs=null;
  function loop(ts){
    if(startTs===null) startTs=ts;
    const elapsed = (ts-startTs) % (DURATION_MS+800);
    setTime(elapsed);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
</script>
