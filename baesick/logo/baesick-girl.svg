      <path d="M270 400 Q306 386 340 398 L336 412 Q304 400 274 414 Z" fill="#FFF8EE"/>
      <path d="M272 396 Q262 356 290 340 Q326 326 346 352 Q358 378 338 398 Q306 408 272 396 Z" fill="#FFF8EE"/>
      <path d="M296 356 Q316 350 334 360 M292 372 Q314 366 336 376 M296 388 Q314 384 330 390" fill="none" stroke-width="4"/>
