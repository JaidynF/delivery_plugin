    <ellipse cx="165" cy="210" rx="24" ry="28" fill="#FFFFFF"/>
    <ellipse cx="235" cy="210" rx="24" ry="28" fill="#FFFFFF"/>
    <circle cx="168" cy="218" r="13" fill="#141414" stroke="none"/>
    <circle cx="232" cy="218" r="13" fill="#141414" stroke="none"/>
    <circle cx="173" cy="213" r="4" fill="#FFFFFF" stroke="none"/>
    <circle cx="237" cy="213" r="4" fill="#FFFFFF" stroke="none"/>
