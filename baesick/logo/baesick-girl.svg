    <path d="M210 206 Q212 182 235 182 Q258 182 260 206 Q235 200 212 206 Z" fill="#E9BBA8"/>
    <path d="M140 206 Q165 199 190 206 M210 206 Q235 199 260 206" fill="none" stroke-width="5"/>
